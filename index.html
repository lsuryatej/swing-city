<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Swing City</title>
    <style>
      :root {
        --ink: #e8ecf5;
        --dim: #8b93a7;
        --faint: #4a5165;
        --panel: rgba(12, 15, 26, 0.82);
        --edge: rgba(255, 255, 255, 0.09);
        --accent: #6fb4ff;
        --warn: #e2a44c;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: #05070e;
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
        overscroll-behavior: none;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* --- Entry overlay ---------------------------------------------- */

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.75rem;
        background: rgba(5, 7, 14, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 20;
        transition: opacity 0.6s ease, visibility 0.6s;
        padding: 2rem;
        text-align: center;
      }
      #overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

      #overlay h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      #overlay p {
        margin: 0;
        max-width: 34ch;
        color: var(--dim);
        line-height: 1.6;
        font-size: 0.95rem;
      }

      #enter {
        appearance: none;
        border: 1px solid var(--edge);
        background: rgba(255, 255, 255, 0.05);
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        padding: 0.7rem 2.2rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s, transform 0.12s, border-color 0.2s;
      }
      #enter:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }
      #enter:active:not(:disabled) { transform: translateY(1px); }
      #enter:disabled { opacity: 0.4; cursor: default; }

      /* --- Player panel ------------------------------------------------ *
       * A bottom-centred pill. Centring rather than corner-anchoring keeps
       * the character, which lives near the middle of frame, clear of it —
       * and a single horizontal row reads as a player at a glance where a
       * stacked card reads as a dialog.                                     */

      #panel {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(1.4rem, env(safe-area-inset-bottom));
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.5rem 0.75rem 0.5rem 0.5rem;
        width: min(430px, calc(100vw - 2rem));
        border: 1px solid var(--edge);
        border-radius: 999px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: opacity 0.4s ease;
      }
      #panel.hidden { opacity: 0; pointer-events: none; }

      /* Artwork slot. No cover art exists, so it doubles as the playlist
         toggle — which is also where the hidden track list lives. */
      #art {
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 1px solid var(--edge);
        border-radius: 50%;
        background: linear-gradient(140deg, #2b3d6b, #6d2b4e 60%, #b8434f);
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      #art span {
        position: absolute;
        inset: 30%;
        border-radius: 50%;
        background: rgba(5, 7, 14, 0.75);
        transition: transform 0.5s ease;
      }
      #panel.playing #art span { animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      #meta { flex: 1 1 auto; min-width: 0; }
      #title {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #artist {
        font-size: 0.72rem;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #time {
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--faint);
        margin-top: 0.15rem;
      }
      #mode { display: none; }
      #bpm { margin-left: 0.4rem; opacity: 0.75; }
      #bpm.warn { color: var(--warn); opacity: 1; }

      .transport { display: flex; align-items: center; gap: 0.3rem; flex: 0 0 auto; }
      .transport button {
        appearance: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        transition: color 0.15s, background 0.15s, transform 0.1s;
      }
      .transport button:hover { color: var(--ink); }
      .transport button:active { transform: scale(0.92); }
      .transport button.primary {
        width: 36px;
        height: 36px;
        background: var(--ink);
        color: #05070e;
      }
      .transport button.primary:hover { background: #fff; }
      .transport svg { width: 15px; height: 15px; }
      .transport svg path { fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
      .transport .primary svg { width: 14px; height: 14px; }

      /* Seek sits as a hairline along the pill's lower edge rather than as a
         control of its own — visible progress, no extra row. */
      #seek {
        appearance: none;
        position: absolute;
        left: 6%;
        bottom: 5px;
        width: 88%;
        height: 2px;
        margin: 0;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 2px;
        cursor: pointer;
      }
      #seek::-webkit-slider-thumb {
        appearance: none;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      #seek::-moz-range-thumb {
        width: 8px; height: 8px; border: 0;
        border-radius: 50%; background: var(--accent);
      }

      /* Track list is hidden until the artwork is clicked. */
      #tracks {
        position: absolute;
        left: 0;
        bottom: calc(100% + 0.6rem);
        width: 100%;
        list-style: none;
        margin: 0;
        padding: 0.4rem;
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        max-height: 40vh;
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transform: translateY(6px);
        transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
      }
      #panel.open #tracks { opacity: 1; visibility: visible; transform: none; }
      #tracks li {
        font-size: 0.78rem;
        color: var(--dim);
        padding: 0.4rem 0.6rem;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tracks li:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
      #tracks li.active { color: var(--accent); }

      /* --- Status / progress ------------------------------------------- */

      #status-wrap {
        position: fixed;
        top: max(1rem, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        width: min(300px, calc(100vw - 2rem));
        text-align: center;
        pointer-events: none;
      }
      #status {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--dim);
        letter-spacing: 0.04em;
        min-height: 1em;
      }
      #bar-track {
        height: 2px;
        margin-top: 0.4rem;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      #bar {
        height: 100%;
        width: 0;
        opacity: 0;
        background: var(--accent);
        transition: width 0.2s ease, opacity 0.3s;
      }

      /* --- Drop target -------------------------------------------------- */

      #drop {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-content: center;
        background: rgba(5, 10, 24, 0.85);
        border: 2px dashed var(--accent);
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.9rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      #drop.over { opacity: 1; }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="status-wrap">
      <div id="status"></div>
      <div id="bar-track"><div id="bar"></div></div>
    </div>

    <div id="panel" class="hidden">
      <button id="art" type="button" aria-label="Show tracks"><span></span></button>
      <div id="meta">
        <div id="title">&mdash;</div>
        <div id="artist"></div>
        <div id="time"><span id="elapsed">0:00</span> / <span id="total">0:00</span> <span id="bpm"></span></div>
      </div>
      <div class="transport">
        <button id="prev" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M18 6l-9 6 9 6z"/></svg>
        </button>
        <button id="play-pause" class="primary" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pp-icon" d="M8 5l11 7-11 7z"/></svg>
        </button>
        <button id="next" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M6 6l9 6-9 6z"/></svg>
        </button>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
      <ul id="tracks"></ul>
    </div>

    <div id="overlay">
      <h1>Swing City</h1>
      <p>
        Pick a track or drop your own. The swing is choreographed to the beat,
        not just reacting to it.
      </p>
      <button id="enter" type="button">Enter</button>
    </div>

    <div id="drop">drop an audio file</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
